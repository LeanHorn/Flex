name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install solver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang z3 libc++-dev libc++abi-dev
      - uses: leanprover/lean-action@v1.6.2
        with:
          # lean-smt declares Mathlib, but Flex's imports do not use it.
          use-mathlib-cache: "false"
          build-args: "Flex Demo flex"
