name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install solver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld z3 libc++-dev libc++abi-dev default-jre-headless unzip
      - name: Install Eldarica 2.3
        run: |
          curl -fsSL https://github.com/uuverifiers/eldarica/releases/download/v2.3/eldarica-bin-2.3.zip -o "$RUNNER_TEMP/eldarica.zip"
          echo "60887e6a44d8e8c89e393b837b04cb130c601d8ce5e5c829349e6f34aba0be6d  $RUNNER_TEMP/eldarica.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/eldarica.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/eldarica-bin-2.3/eld"
          echo "$RUNNER_TEMP/eldarica-bin-2.3" >> "$GITHUB_PATH"
      - name: Configure Lean C compiler
        # cvc5 needs the runner's glibc; keep Lean's bundled C++ and runtime libraries.
        run: |
          cat > "$RUNNER_TEMP/flex-clang" <<'EOF'
          #!/bin/sh
          set -eu
          lean_prefix="$(lean --print-prefix)"
          exec /usr/bin/clang -fuse-ld=lld -L "$lean_prefix/lib" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/flex-clang"
          echo "LEAN_CC=$RUNNER_TEMP/flex-clang" >> "$GITHUB_ENV"
      - uses: leanprover/lean-action@v1.6.2
        with:
          # Build the Mathlib modules used by SMTLib-to-Lean from source.
          use-mathlib-cache: "false"
          build-args: "Flex Demo flex"
      - name: Run CLI
        run: .lake/build/bin/flex
      - name: Check flex checkpoints
        run: lake --log-level=error lean Tests/Flex.lean -- --error=hasSorry
      - name: Check RQ2 tooling
        run: |
          lake --log-level=error lean evaluation/RQ2/RQ2.lean -- --error=hasSorry
          python3 -B evaluation/RQ2/benchmark_rq2.py --help
      - name: Check RQ3 tooling
        run: |
          lake --log-level=error lean evaluation/RQ3a/RQ3.lean -- --error=hasSorry
          python3 -B evaluation/RQ3a/benchmark.py --help
          python3 -B evaluation/RQ3b/benchmark.py --help
          python3 -B evaluation/RQ3b/report.py --help
          python3 -B evaluation/RQ3a/test_harness.py
      - name: Check RQ4 tooling
        run: |
          python3 -B evaluation/RQ4/benchmark.py --help
          python3 -B evaluation/RQ4/report.py --help
          python3 -B evaluation/RQ4/export.py --help
